<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unggah Excel - Dashboard HPS</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#17212f;--mu:#6b7686;--bd:#e3e8ef;--pr:#0b5cab;--pr2:#e6f0fb;--ok:#1a9d5c;--wa:#e8a317;--er:#d6453d;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e141c;--card:#161e29;--tx:#e8edf3;--mu:#8d99a9;--bd:#243040;--pr:#4b9bf0;--pr2:#17304d;--ok:#35c07e;--wa:#f0b73d;--er:#f06a62;--sh:none}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:-.2px}h1 small{display:block;font-size:11px;font-weight:400;color:var(--mu)}
a{color:var(--pr)}
main{padding:18px 24px 40px;max-width:760px;margin:auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;box-shadow:var(--sh)}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:34px 18px;text-align:center;color:var(--mu);cursor:pointer;transition:.15s;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--pr);color:var(--pr);background:var(--pr2)}
.drop b{color:var(--tx);display:block;font-size:15px;margin-bottom:4px}
button{font:inherit;cursor:pointer;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--pr)}button.p{background:var(--pr);border-color:var(--pr);color:#fff}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;margin-top:6px}
label{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:10px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:var(--pr);transition:.2s}
.msg{padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px;display:none}
.msg.ok{display:block;background:#dff5ea;color:#12794a}.msg.err{display:block;background:#fbe4e2;color:#b4322b}
.msg.wait{display:block;background:var(--pr2);color:var(--pr)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px}
.kv:last-child{border:0}.kv span:first-child{color:var(--mu)}
small{color:var(--mu)}
</style></head><body>
<header><h1>Unggah Excel — Dashboard HPS<small>Server lokal jaringan kantor</small></h1>
<div style="margin-left:auto"><a href="./" style="margin-right:12px">← Kembali ke dashboard</a></div></header>
<main>
<div class="card">
  <div class="drop" id="drop">
    <b>Letakkan file Excel (.xlsx) di sini</b>
    atau klik untuk memilih file
    <input type="file" id="file" accept=".xlsx" style="display:none">
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="msg" id="msg"></div>
  <label>Token (hanya jika server memakai token) <input type="password" id="tok" placeholder="kosongkan kalau tidak ada"></label>
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
    <button id="refresh" type="button">Perbarui dari Excel yang ada di folder</button>
    <button class="p" id="open" type="button">Buka dashboard</button>
  </div>
  <small style="display:block;margin-top:10px">Alternatif: salin file .xlsx langsung ke folder server (share jaringan) — server rebuilding otomatis dalam 20 detik.</small>
</div>
<div class="card">
  <h2 style="font-size:13px;margin:0 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px">Status server</h2>
  <div id="st"><small>memuat…</small></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const drop=$("#drop"),file=$("#file"),msg=$("#msg"),bar=$("#bar");
const tok=()=>$("#tok").value.trim();
$("#tok").value=localStorage.getItem("hps_token")||"";
$("#tok").oninput=()=>localStorage.setItem("hps_token",$("#tok").value.trim());
function say(t,c){msg.textContent=t;msg.className="msg "+(c||"wait")}
drop.onclick=()=>file.click();
file.onchange=()=>file.files[0]&&send(file.files[0]);
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)send(f)});
async function send(f){
  if(!/\.xlsx$/i.test(f.name)){say("File harus .xlsx","err");return}
  say("Mengunggah "+f.name+"…","wait");bar.style.width="30%";
  try{
    const r=await fetch("api/upload",{method:"POST",body:f,headers:{"Content-Type":"application/octet-stream","X-Filename":f.name,"X-Token":tok()}});
    const j=await r.json().catch(()=>({ok:false,error:"respons server tidak valid"}));
    bar.style.width="100%";
    if(j.ok){say("Berhasil! "+j.info.rows+" baris, data per "+j.info.generated+". Dashboard ter-update otomatis.","ok")}
    else say("Gagal: "+j.error,"err");
  }catch(e){bar.style.width="0";say("Gagal menghubungi server: "+e.message,"err")}
}
$("#refresh").onclick=async()=>{
  say("Membangun ulang data…","wait");
  try{
    const r=await fetch("api/refresh",{method:"POST",headers:{"X-Token":tok()}});
    const j=await r.json().catch(()=>({ok:false,error:"respons server tidak valid"}));
    if(j.ok)say("Berhasil! "+j.info.rows+" baris, data per "+j.info.generated+".","ok");
    else say("Gagal: "+(j.error||j.info&&j.info.error||"tidak diketahui"),"err");
  }catch(e){say("Gagal menghubungi server: "+e.message,"err")}
  load();
};
$("#open").onclick=()=>location.href="./";
async function load(){
  try{
    const r=await fetch("api/status",{cache:"no-store"});const j=await r.json();
    $("#st").innerHTML=[
      ["Server",j.server+" (start "+j.started+")"],
      ["Data terakhir",(j.generated||"-")+" · "+j.rows+" baris"],
      ["Sumber",j.source||"-"],
      ["Folder server",j.folder],
      ["Update berhasil",j.builds+"×"],
      ["Error terakhir",j.last_error||"tidak ada"]
    ].map(([a,b])=>'<div class="kv"><span>'+a+"</span><span>"+String(b).replace(/</g,"&lt;")+"</span></div>").join("");
  }catch(e){$("#st").innerHTML='<small>Server tidak merespons (offline?)</small>'}
}
load();
</script></body></html>
