name: Deploy Dashboard HPS

# Otomatis: regenerate data.js dari Excel -> publikasikan ke GitHub Pages
# Jalankan manual juga bisa: tab Actions -> "Deploy Dashboard HPS" -> Run workflow
on:
  push:
    branches: [main]
    paths:
      - "*.xlsx"
      - "index.html"
      - "data.js"
      - "data.meta.json"
      - "update_data.py"
      - ".nojekyll"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"   # 02:17 WIB, refresh harian

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python + openpyxl
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade openpyxl

      - name: Bangun data.js dari Excel
        id: gen
        continue-on-error: true
        run: python update_data.py

      - name: Simpan hasil generate ke repository
        if: steps.gen.outcome == 'success' && github.actor != 'github-actions[bot]'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.meta.json
          if git diff --cached --quiet; then
            echo "data.js tidak berubah"
          else
            git commit -m "auto: regenerate data.js dari Excel"
            git push
          fi

      - name: Siapkan folder situs
        run: |
          mkdir -p _site
          cp -f index.html data.js data.meta.json _site/
          [ -f .nojekyll ] && cp -f .nojekyll _site/
          ls -l _site

      - name: Minta build GitHub Pages (mode branch)
        id: apibuild
        continue-on-error: true
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /tmp/pages_build.json -w "HTTP %{http_code}\n"
          cat /tmp/pages_build.json || true

      - name: Deploy ke GitHub Pages (mode GitHub Actions)
        id: deploy
        continue-on-error: true
        run: |
          echo "Deploy lewat GitHub Actions aktif bila Settings > Pages > Source = GitHub Actions."

      - uses: actions/configure-pages@v5
        id: cfg
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        continue-on-error: true
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: pages
        continue-on-error: true

      - name: Ringkasan
        run: |
          echo "Generate data.js : ${{ steps.gen.outcome }}"
          echo "Build via API    : ${{ steps.apibuild.outcome }}"
          echo "Deploy Actions   : ${{ steps.pages.outcome }}"
          echo "Situs            : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
