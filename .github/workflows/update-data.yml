name: Regenerasi data HPS (repo cadangan)

# Repo ini hanya cadangan. Dashboard utama jalan di server lokal jaringan kantor.
# Workflow ini menjaga file data.js tetap sama dengan isi folder server.
on:
  push:
    branches: [main]
    paths:
      - "*.xlsx"
      - "update_data.py"
      - "data.js"
      - "data.meta.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade openpyxl
      - name: Bangun data.js dari Excel
        id: gen
        continue-on-error: true
        run: python update_data.py
      - name: Simpan hasil ke repository
        if: steps.gen.outcome == 'success' && github.actor != 'github-actions[bot]'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.meta.json
          if git diff --cached --quiet; then
            echo "data.js tidak berubah"
          else
            git commit -m "auto: regenerate data.js dari Excel"
            git push
          fi
